<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | Petya Digital Store</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B82F6' stroke-width='2'%3E%3Cpath d='M7 3h10a1 1 0 0 1 1 1v16l-3-2-2 2-2-2-2 2-3-2V4a1 1 0 0 1 1-1z'/%3E%3Cpath d='M9 8h6M9 12h6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1526;
    --bg-elev:#0F1D33;
    --surface:#132A47;
    --surface-2:#1B3B63;
    --border:rgba(147,197,253,0.14);
    --border-strong:rgba(147,197,253,0.24);
    --text:#F0F7FF;
    --text-dim:#B4D2F5;
    --text-faint:#7DA3D1;
    --accent:#3B82F6;
    --accent-2:#22D3EE;
    --gold-soft:rgba(34,211,238,0.16);
    --danger:#E0555A;
    --success:#22C55E;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
    --header-bg:rgba(11,21,38,0.72);
    --hover-tint:rgba(147,197,253,0.07);
    --hover-tint-strong:rgba(147,197,253,0.12);
    --shadow-card:0 4px 20px rgba(0,20,50,0.28);
  }
  body.light{
    --bg:#EAF3FF;
    --bg-elev:#F5FAFF;
    --surface:#FFFFFF;
    --surface-2:#DCEBFC;
    --border:rgba(15,64,120,0.12);
    --border-strong:rgba(15,64,120,0.2);
    --text:#0B1E36;
    --text-dim:#3E5D82;
    --text-faint:#6F91B8;
    --accent:#2563EB;
    --accent-2:#0EA5E9;
    --gold-soft:rgba(14,165,233,0.14);
    --header-bg:rgba(234,243,255,0.82);
    --hover-tint:rgba(15,64,120,0.06);
    --hover-tint-strong:rgba(15,64,120,0.09);
    --shadow-card:0 4px 20px rgba(15,64,120,0.1);
  }
  body{visibility:hidden;}
  body.theme-ready{visibility:visible;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{overflow-x:hidden;width:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
    line-height:1.65;
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit;}
  ul{list-style:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  .num{font-family:"IBM Plex Sans",sans-serif;}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:60;
    background:var(--header-bg);
    backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--border);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:980px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;}
  .logo-mark{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,var(--accent),#6D3FE0);
    display:flex;align-items:center;justify-content:center;
  }
  .logo-mark svg{width:16px;height:16px;}
  .nav-right{display:flex;align-items:center;gap:6px;}
  .back-link{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-dim);padding:8px 10px;border-radius:10px;}
  .back-link:hover{color:var(--text);background:var(--hover-tint);}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .icon-btn:hover{background:var(--hover-tint);}

  main{padding:36px 0 70px;}

  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:23px;font-weight:800;letter-spacing:-0.01em;}
  .page-head p{color:var(--text-faint);font-size:13.5px;margin-top:4px;}

  /* ---------- Shell layout ---------- */
  .account-shell{display:grid;grid-template-columns:272px 1fr;gap:26px;align-items:start;}

  /* ---------- Sidebar / profile ---------- */
  .side{
    position:sticky;top:92px;
    background:linear-gradient(175deg,var(--surface),var(--bg-elev));
    border:1px solid var(--border-strong);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .side-banner{height:56px;background:linear-gradient(120deg,var(--accent),#6D3FE0 60%,var(--accent-2));}
  .side-body{padding:0 20px 18px;margin-top:-30px;}
  .side-avatar{
    width:64px;height:64px;border-radius:50%;
    background:var(--surface);
    border:3px solid var(--surface);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .side-avatar-inner{
    width:100%;height:100%;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#6D3FE0);
    color:#fff;font-weight:800;font-size:24px;
    display:flex;align-items:center;justify-content:center;
  }
  .side-name{font-weight:800;font-size:16px;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-email{font-size:12.5px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-since{font-size:11.5px;color:var(--text-faint);margin-top:8px;}

  .side-nav{list-style:none;padding:6px 10px;border-top:1px solid var(--border);margin-top:16px;}
  .side-nav li + li{margin-top:2px;}
  .side-link{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;border-radius:12px;
    font-size:14px;font-weight:700;color:var(--text-dim);
    transition:background .2s,color .2s;
  }
  .side-link svg{width:18px;height:18px;flex:none;opacity:.85;}
  .side-link .count{
    margin-inline-start:auto;font-size:11.5px;font-weight:800;
    background:var(--bg-elev);border:1px solid var(--border);
    padding:1px 8px;border-radius:999px;color:var(--text-faint);
    display:none;
  }
  .side-link .count.show{display:inline-block;}
  .side-link:hover{background:var(--hover-tint);color:var(--text);}
  .side-link.active{background:var(--accent);color:#fff;}
  .side-link.active .count{background:rgba(255,255,255,0.22);color:#fff;border-color:transparent;}

  .side-foot{padding:12px 20px 18px;border-top:1px solid var(--border);}
  .logout-link{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--danger);padding:8px 4px;}
  .logout-link:hover{opacity:.8;}

  /* Mobile profile bar (shown instead of sidebar under 860px) */
  .mobile-profile{display:none;}

  /* ---------- Content ---------- */
  .content{min-width:0;}
  .panel{display:none;flex-direction:column;gap:14px;}
  .panel.active{display:flex;}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .panel-head h2{font-size:17px;font-weight:800;}
  .panel-head .sub{font-size:12.5px;color:var(--text-faint);}

  /* ---------- Empty / login states ---------- */
  .state-card{
    background:linear-gradient(165deg,var(--surface),var(--bg-elev));
    border:1px solid var(--border-strong);
    border-radius:var(--radius-lg);
    padding:46px 26px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    box-shadow:var(--shadow-card);
  }
  .state-icon{
    width:54px;height:54px;border-radius:50%;
    background:var(--gold-soft);color:var(--accent-2);
    display:flex;align-items:center;justify-content:center;
  }
  .state-icon svg{width:26px;height:26px;}
  .state-card h3{font-size:16.5px;font-weight:800;}
  .state-card p{color:var(--text-dim);font-size:13.5px;max-width:360px;line-height:1.8;}
  .auth-error{color:var(--danger);font-size:13px;display:none;}
  .auth-error.show{display:block;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .2s,box-shadow .2s;white-space:nowrap;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#6D3FE0);color:#fff;box-shadow:0 8px 22px rgba(59,130,246,0.32);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(59,130,246,0.4);}
  .btn-ghost{border:1px solid var(--border-strong);color:var(--text);}
  .btn-ghost:hover{background:var(--hover-tint);}
  .google-btn{width:100%;max-width:300px;}

  /* ---------- Orders ---------- */
  .order-list{display:flex;flex-direction:column;gap:10px;}
  .order-card{
    background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px;display:flex;gap:14px;align-items:flex-start;
    transition:border-color .2s;
  }
  .order-card:hover{border-color:var(--border-strong);}
  .order-icon{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:var(--bg-elev);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
  }
  .order-icon svg{width:18px;height:18px;color:var(--accent-2);}
  .order-body{flex:1;min-width:0;}
  .order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .order-name{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order-date{font-size:12px;color:var(--text-faint);margin-top:3px;}
  .order-price{font-weight:800;font-size:15px;color:var(--text);white-space:nowrap;flex:none;}
  .order-status{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:var(--gold-soft);color:var(--accent-2);margin-top:8px;
  }
  .order-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .order-status.status-done{background:rgba(34,197,94,0.15);color:var(--success);}

  /* skeleton loading */
  .skeleton{display:flex;flex-direction:column;gap:10px;}
  .skeleton-row{height:76px;border-radius:var(--radius-md);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:150% 0;}100%{background-position:-50% 0;}}
  @media (prefers-reduced-motion:reduce){.skeleton-row{animation:none;}}

  /* ---------- Cart ---------- */
  .cart-list{display:flex;flex-direction:column;gap:10px;}
  .cart-card{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-md);
    padding:13px 15px;
  }
  .cart-info{flex:1;min-width:0;}
  .cart-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cart-price{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .qty-stepper{display:flex;align-items:center;gap:2px;flex:none;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:2px;}
  .qty-btn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;}
  .qty-btn:hover{background:var(--hover-tint-strong);}
  .qty-val{width:24px;text-align:center;font-weight:700;font-size:13.5px;}
  .cart-remove{color:var(--danger);font-size:11.5px;font-weight:700;padding:6px;flex:none;}
  .cart-remove:hover{opacity:.75;}

  .cart-summary{
    background:linear-gradient(165deg,var(--surface),var(--bg-elev));
    border:1px solid var(--border-strong);border-radius:var(--radius-lg);
    padding:18px 20px;margin-top:4px;
  }
  .cart-summary-row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--text-dim);}
  .cart-summary-row + .cart-summary-row{margin-top:8px;}
  .cart-summary-total{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:10px;border-top:1px solid var(--border);font-weight:800;font-size:17px;}
  .cart-summary .btn{width:100%;margin-top:14px;}

  @media (max-width:860px){
    .account-shell{grid-template-columns:1fr;}
    .side{display:none;}
    .mobile-profile{
      display:flex;align-items:center;gap:12px;
      background:linear-gradient(165deg,var(--surface),var(--bg-elev));
      border:1px solid var(--border-strong);border-radius:var(--radius-lg);
      padding:16px;margin-bottom:16px;box-shadow:var(--shadow-card);
    }
    .mobile-avatar{width:48px;height:48px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--accent),#6D3FE0);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;}
    .mobile-info{flex:1;min-width:0;}
    .mobile-name{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mobile-email{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mobile-logout{color:var(--danger);font-size:12.5px;font-weight:700;padding:8px;flex:none;}

    .mobile-tabs{
      display:flex;gap:6px;background:var(--bg-elev);border:1px solid var(--border);
      border-radius:999px;padding:5px;margin-bottom:18px;
      position:sticky;top:62px;z-index:30;
    }
    .mobile-tabs .side-link{flex:1;justify-content:center;border-radius:999px;padding:10px 8px;font-size:13.5px;}
    .mobile-tabs .side-link svg{display:none;}
  }
  @media (min-width:861px){
    .mobile-tabs{display:none;}
  }
  @media (max-width:520px){
    .wrap{padding:0 14px;}
    main{padding:20px 0 50px;}
    .page-head h1{font-size:20px;}
    .order-card,.cart-card{padding:12px;gap:10px;}
    .order-name{font-size:13.5px;}
    .state-card{padding:36px 18px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Petya Digital Store
    </a>
    <div class="nav-right">
      <a class="back-link" href="index.html">
        رجوع للمتجر
      </a>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="تبديل المظهر">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1>حسابي</h1>
      <p>معلومات حسابك، سلة مشترياتك، وسجل طلباتك في مكان واحد.</p>
    </div>

    <!-- Mobile-only compact profile bar -->
    <div class="mobile-profile" id="mobileProfile" style="display:none;">
      <div class="mobile-avatar" id="mobileAvatar">؟</div>
      <div class="mobile-info">
        <div class="mobile-name" id="mobileName">زائر</div>
        <div class="mobile-email" id="mobileEmail"></div>
      </div>
      <button type="button" class="mobile-logout" id="mobileLogoutBtn">خروج</button>
    </div>

    <!-- Mobile segmented tabs -->
    <div class="mobile-tabs" id="mobileTabs">
      <button type="button" class="side-link active" data-tab="orders">طلباتي <span class="count" id="mOrdersCount"></span></button>
      <button type="button" class="side-link" data-tab="cart">السلة <span class="count" id="mCartCount"></span></button>
    </div>

    <div class="account-shell">
      <!-- ---------- Sidebar (desktop) ---------- -->
      <aside class="side" id="sideProfile">
        <div class="side-banner"></div>
        <div class="side-body">
          <div class="side-avatar"><div class="side-avatar-inner" id="sideAvatar">؟</div></div>
          <div class="side-name" id="sideName">زائر</div>
          <div class="side-email" id="sideEmail">سجّل الدخول لعرض حسابك</div>
          <div class="side-since" id="sideSince"></div>
        </div>
        <ul class="side-nav">
          <li>
            <button type="button" class="side-link active" data-tab="orders">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10a1 1 0 011 1v16l-3-2-2 2-2-2-2 2-3-2V4a1 1 0 011-1z"/><path d="M9 8h6M9 12h6" stroke-linecap="round"/></svg>
              طلباتي
              <span class="count" id="sOrdersCount"></span>
            </button>
          </li>
          <li>
            <button type="button" class="side-link" data-tab="cart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.2a2 2 0 002 1.6h7.6a2 2 0 002-1.6L20 8H6"/></svg>
              السلة
              <span class="count" id="sCartCount"></span>
            </button>
          </li>
        </ul>
        <div class="side-foot">
          <button type="button" class="logout-link" id="logoutBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            تسجيل الخروج
          </button>
        </div>
      </aside>

      <!-- ---------- Content ---------- -->
      <div class="content">

        <!-- Logged-out state -->
        <div class="state-card" id="loginCard" style="display:none;">
          <div class="state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <h3>سجّل الدخول لعرض حسابك</h3>
          <p>سجّل دخولك بضغطة واحدة باستخدام حساب Google لعرض معلومات حسابك، سلتك، وسجل طلباتك.</p>
          <p class="auth-error" id="authError"></p>
          <button type="button" id="googleSignInBtn" class="btn btn-ghost google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            الدخول بحساب Google
          </button>
        </div>

        <!-- Orders panel -->
        <div class="panel active" id="ordersPanel">
          <div class="panel-head">
            <h2>سجل الطلبات</h2>
            <span class="sub" id="ordersSub"></span>
          </div>
          <div id="ordersContent">
            <div class="skeleton">
              <div class="skeleton-row"></div>
              <div class="skeleton-row"></div>
              <div class="skeleton-row"></div>
            </div>
          </div>
        </div>

        <!-- Cart panel -->
        <div class="panel" id="cartPanel">
          <div class="panel-head">
            <h2>عناصر السلة</h2>
            <span class="sub" id="cartSub"></span>
          </div>
          <div id="cartContent"></div>
        </div>

      </div>
    </div>
  </div>
</main>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB59fcv3POq5xS8zc52JYF97Eacw4mO7pA",
    authDomain: "petya-digital-product.firebaseapp.com",
    projectId: "petya-digital-product",
    storageBucket: "petya-digital-product.firebasestorage.app",
    messagingSenderId: "442610065781",
    appId: "1:442610065781:web:b203de716d66b1b822b33c",
    measurementId: "G-V4H5DVLTCT"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const googleProvider = new firebase.auth.GoogleAuthProvider();
  const db = firebase.firestore();
</script>

<script>
  // ---------- Theme (kept in sync with the main store) ----------
  (function initTheme(){
    const saved = localStorage.getItem('petya-theme');
    if (saved === 'light') document.body.classList.add('light');
    document.body.classList.add('theme-ready');
  })();
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('light');
    localStorage.setItem('petya-theme', document.body.classList.contains('light') ? 'light' : 'dark');
  });

  // ---------- Cart (shared with the main store via localStorage) ----------
  const CART_KEY = 'petya-cart';
  function getCart(){
    try {
      const raw = localStorage.getItem(CART_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveCart(items){
    localStorage.setItem(CART_KEY, JSON.stringify(items));
    updateCounts();
    renderCartPanel();
  }
  function removeFromCart(name, price){
    saveCart(getCart().filter(it => !(it.name === name && it.price === price)));
  }
  function changeCartQty(name, price, delta){
    const items = getCart();
    const item = items.find(it => it.name === name && it.price === price);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0){
      saveCart(items.filter(it => it !== item));
    } else {
      saveCart(items);
    }
  }

  function updateCounts(){
    const cartCount = getCart().reduce((sum, it) => sum + it.qty, 0);
    [document.getElementById('sCartCount'), document.getElementById('mCartCount')].forEach(el => {
      el.textContent = cartCount > 0 ? String(cartCount) : '';
      el.classList.toggle('show', cartCount > 0);
    });
  }

  function renderCartPanel(){
    const content = document.getElementById('cartContent');
    const sub = document.getElementById('cartSub');
    const items = getCart();
    if (items.length === 0){
      sub.textContent = '';
      content.innerHTML = `
        <div class="state-card">
          <div class="state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.2a2 2 0 002 1.6h7.6a2 2 0 002-1.6L20 8H6"/></svg>
          </div>
          <h3>سلتك فارغة</h3>
          <p>أضف منتجات من المتجر بالضغط على "اطلب الآن" ثم "أضف إلى السلة".</p>
          <a href="index.html#products" class="btn btn-primary">تصفح المنتجات</a>
        </div>`;
      return;
    }
    const totalQty = items.reduce((sum, it) => sum + it.qty, 0);
    const total = items.reduce((sum, it) => sum + it.price * it.qty, 0);
    sub.textContent = `${totalQty} عنصر`;

    const rows = items.map(it => `
      <div class="cart-card">
        <div class="cart-info">
          <div class="cart-name">${it.name}</div>
          <div class="cart-price">${it.price} دج للوحدة</div>
        </div>
        <div class="qty-stepper">
          <button type="button" class="qty-btn" data-qty-minus data-name="${it.name}" data-price="${it.price}">−</button>
          <span class="qty-val num">${it.qty}</span>
          <button type="button" class="qty-btn" data-qty-plus data-name="${it.name}" data-price="${it.price}">+</button>
        </div>
        <button type="button" class="cart-remove" data-cart-remove data-name="${it.name}" data-price="${it.price}">حذف</button>
      </div>
    `).join('');

    content.innerHTML = `
      <div class="cart-list">${rows}</div>
      <div class="cart-summary">
        <div class="cart-summary-row"><span>عدد العناصر</span><span class="num">${totalQty}</span></div>
        <div class="cart-summary-total"><span>الإجمالي</span><span class="num">${total} دج</span></div>
        <button type="button" class="btn btn-primary" id="cartCheckoutBtn">تأكيد الطلب</button>
      </div>
    `;

    content.querySelectorAll('[data-qty-plus]').forEach(btn => {
      btn.addEventListener('click', () => changeCartQty(btn.dataset.name, Number(btn.dataset.price), 1));
    });
    content.querySelectorAll('[data-qty-minus]').forEach(btn => {
      btn.addEventListener('click', () => changeCartQty(btn.dataset.name, Number(btn.dataset.price), -1));
    });
    content.querySelectorAll('[data-cart-remove]').forEach(btn => {
      btn.addEventListener('click', () => removeFromCart(btn.dataset.name, Number(btn.dataset.price)));
    });
    document.getElementById('cartCheckoutBtn').addEventListener('click', () => {
      window.location.href = 'index.html?checkout=cart';
    });
  }

  // ---------- Orders (from Firestore) ----------
  function orderStatusLabel(status){
    const map = { new: 'قيد المعالجة', pending: 'قيد المعالجة', done: 'مكتمل', completed: 'مكتمل', activated: 'مفعّل' };
    return map[status] || 'قيد المعالجة';
  }
  const receiptIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10a1 1 0 011 1v16l-3-2-2 2-2-2-2 2-3-2V4a1 1 0 011-1z"/><path d="M9 8h6M9 12h6" stroke-linecap="round"/></svg>`;

  function renderOrdersPanel(){
    const content = document.getElementById('ordersContent');
    const sub = document.getElementById('ordersSub');
    const sCount = document.getElementById('sOrdersCount');
    const mCount = document.getElementById('mOrdersCount');
    sub.textContent = '';
    [sCount, mCount].forEach(el => el.classList.remove('show'));

    if (!auth.currentUser){
      content.innerHTML = `
        <div class="state-card">
          <div class="state-icon">${receiptIcon}</div>
          <h3>سجّل الدخول لعرض طلباتك</h3>
          <p>بمجرد تسجيل الدخول، ستظهر هنا كل طلباتك السابقة وحالتها.</p>
        </div>`;
      return;
    }

    content.innerHTML = `
      <div class="skeleton">
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>`;

    db.collection('orders')
      .where('accountEmail', '==', auth.currentUser.email)
      .orderBy('createdAt', 'desc')
      .get()
      .then((snapshot) => {
        if (snapshot.empty){
          content.innerHTML = `
            <div class="state-card">
              <div class="state-icon">${receiptIcon}</div>
              <h3>لا توجد طلبات بعد</h3>
              <p>تصفح المنتجات وابدأ طلبك الأول، وسيظهر هنا فور تأكيده.</p>
              <a href="index.html#products" class="btn btn-primary">تصفح المنتجات</a>
            </div>`;
          return;
        }
        const count = snapshot.size;
        sub.textContent = `${count} طلب`;
        sCount.textContent = String(count);
        mCount.textContent = String(count);
        [sCount, mCount].forEach(el => el.classList.add('show'));

        const rows = snapshot.docs.map(doc => {
          const o = doc.data();
          const date = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleDateString('ar-DZ') : '';
          const status = orderStatusLabel(o.status);
          const statusClass = (o.status === 'done' || o.status === 'completed' || o.status === 'activated') ? 'status-done' : '';
          return `
            <div class="order-card">
              <div class="order-icon">${receiptIcon}</div>
              <div class="order-body">
                <div class="order-top">
                  <div>
                    <div class="order-name" title="${o.product || ''}">${o.product || ''}</div>
                    ${date ? `<div class="order-date">${date}</div>` : ''}
                  </div>
                  ${o.total ? `<div class="order-price num">${o.total} دج</div>` : ''}
                </div>
                <span class="order-status ${statusClass}">${status}</span>
              </div>
            </div>
          `;
        }).join('');
        content.innerHTML = `<div class="order-list">${rows}</div>`;
      })
      .catch((err) => {
        console.error('Failed to load orders:', err);
        content.innerHTML = `
          <div class="state-card">
            <div class="state-icon">${receiptIcon}</div>
            <h3>تعذّر تحميل الطلبات</h3>
            <p>حدث خطأ أثناء الاتصال بالخادم، حاول تحديث الصفحة بعد قليل.</p>
          </div>`;
      });
  }

  // ---------- Tabs ----------
  function switchTab(tab){
    document.querySelectorAll('.side-link[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('ordersPanel').classList.toggle('active', tab === 'orders');
    document.getElementById('cartPanel').classList.toggle('active', tab === 'cart');
    if (tab === 'orders') renderOrdersPanel();
    if (tab === 'cart') renderCartPanel();
    const url = new URL(window.location);
    url.searchParams.set('tab', tab);
    history.replaceState(null, '', url);
  }
  document.querySelectorAll('.side-link[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ---------- Auth ----------
  const authError = document.getElementById('authError');
  function showAuthError(msg){
    authError.textContent = msg;
    authError.classList.add('show');
  }
  function clearAuthError(){
    authError.textContent = '';
    authError.classList.remove('show');
  }
  function firebaseErrorMessage(err){
    const map = {
      'auth/popup-closed-by-user': 'تم إغلاق نافذة الدخول قبل إتمام العملية.',
      'auth/popup-blocked': 'المتصفح منع فتح نافذة الدخول، اسمح بالنوافذ المنبثقة وحاول مرة أخرى.',
      'auth/cancelled-popup-request': 'تم إلغاء الطلب، حاول مرة أخرى.',
      'auth/network-request-failed': 'تعذر الاتصال بالخادم، تحقق من اتصالك بالإنترنت.',
      'auth/unauthorized-domain': 'هذا النطاق غير مصرّح له بتسجيل الدخول، تحقق من إعدادات Firebase.'
    };
    return map[err.code] || 'حدث خطأ غير متوقع، حاول مرة أخرى.';
  }
  document.getElementById('googleSignInBtn').addEventListener('click', async () => {
    clearAuthError();
    const btn = document.getElementById('googleSignInBtn');
    btn.disabled = true;
    try {
      await auth.signInWithPopup(googleProvider);
    } catch (err){
      showAuthError(firebaseErrorMessage(err));
    } finally {
      btn.disabled = false;
    }
  });
  function doLogout(){ auth.signOut(); }
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('mobileLogoutBtn').addEventListener('click', doLogout);

  function renderAccountState(user){
    const sideProfile = document.getElementById('sideProfile');
    const mobileProfile = document.getElementById('mobileProfile');
    const loginCard = document.getElementById('loginCard');
    const mobileTabs = document.getElementById('mobileTabs');

    if (user){
      const label = (user.displayName || user.email || '؟').trim();
      const initial = label.charAt(0).toUpperCase();
      document.getElementById('sideAvatar').textContent = initial;
      document.getElementById('sideName').textContent = user.displayName || user.email;
      document.getElementById('sideEmail').textContent = user.email || '';
      document.getElementById('mobileAvatar').textContent = initial;
      document.getElementById('mobileName').textContent = user.displayName || user.email;
      document.getElementById('mobileEmail').textContent = user.email || '';
      if (user.metadata && user.metadata.creationTime){
        const joined = new Date(user.metadata.creationTime).toLocaleDateString('ar-DZ');
        document.getElementById('sideSince').textContent = `عضو منذ ${joined}`;
      }
      loginCard.style.display = 'none';
      mobileProfile.style.display = 'flex';
      mobileTabs.style.display = '';
    } else {
      document.getElementById('sideAvatar').textContent = '؟';
      document.getElementById('sideName').textContent = 'زائر';
      document.getElementById('sideEmail').textContent = 'سجّل الدخول لعرض حسابك';
      document.getElementById('sideSince').textContent = '';
      loginCard.style.display = 'flex';
      mobileProfile.style.display = 'none';
    }
  }

  auth.onAuthStateChanged((user) => {
    renderAccountState(user);
    updateCounts();
    const activeTab = document.querySelector('.side-link.active[data-tab]');
    const currentTab = activeTab ? activeTab.dataset.tab : 'orders';
    if (currentTab === 'orders') renderOrdersPanel();
  });

  // ---------- Initial tab from ?tab= ----------
  (function initTab(){
    const params = new URLSearchParams(window.location.search);
    const requested = params.get('tab');
    switchTab(requested === 'cart' ? 'cart' : 'orders');
  })();

  updateCounts();
</script>
</body>
</html>
