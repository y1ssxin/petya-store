<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم Petya</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1526;--elev:#0F1D33;--surface:#132A47;--text:#F0F7FF;--dim:#B4D2F5;--faint:#7DA3D1;--accent:#3B82F6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:rgba(125,163,209,.18)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.hide{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:380px;width:100%}
.btn{background:var(--accent);padding:12px 20px;border-radius:12px;font-weight:600;width:100%;margin-top:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);width:auto;margin:0;padding:8px 14px;font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--elev);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.live{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:p 1.6s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
main{padding:20px;max-width:1200px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px;margin-top:4px}
.stat span{color:var(--faint);font-size:13px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between}
.row{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.row:first-of-type{border-top:0}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.meta{color:var(--dim);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(59,130,246,.2);color:#9cc4ff}
.tag.pending{background:rgba(245,158,11,.2);color:#fbbf24}
.tag.activated,.tag.done,.tag.completed,.tag.received{background:rgba(34,197,94,.2);color:#4ade80}
.tag.cancelled{background:rgba(239,68,68,.2);color:#f87171}
.tag.report{background:rgba(239,68,68,.25);color:#fca5a5}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{background:var(--elev);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px}
.acts a{background:#25D366;color:#04210f;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none}
.fresh{animation:f 3s ease-out}
@keyframes f{from{background:rgba(59,130,246,.35)}to{background:transparent}}
.empty{color:var(--faint);font-size:14px;padding:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);padding:12px 20px;border-radius:12px;font-weight:600;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.err{color:#f87171;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<div id="login" class="center">
  <div class="box">
    <h1 style="font-size:20px">لوحة تحكم Petya</h1>
    <p style="color:var(--dim);margin-top:8px;font-size:14px">للمالك فقط. سجّل الدخول بحساب Google الخاص بك.</p>
    <button class="btn" id="gBtn">الدخول بحساب Google</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="live"><span class="dot" id="dot"></span><span>مباشر</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn ghost" id="soundBtn">🔔 الصوت: مفعّل</button>
      <button class="btn ghost" id="outBtn">خروج</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><span>طلبات جديدة</span><b id="sNew">0</b></div>
      <div class="stat"><span>طلبات اليوم</span><b id="sToday">0</b></div>
      <div class="stat"><span>مبيعات اليوم (DA)</span><b id="sSales">0</b></div>
      <div class="stat"><span>بلاغات "لم أستلم"</span><b id="sRep">0</b></div>
      <div class="stat"><span>تسجيلات دخول اليوم</span><b id="sLog">0</b></div>
    </div>
    <div class="grid">
      <section class="panel"><h2>الطلبات <small id="oCount" style="color:var(--faint)"></small></h2><div id="orders"></div></section>
      <div>
        <section class="panel"><h2>آخر تسجيلات الدخول</h2><div id="logins"><p class="empty">لا توجد بيانات بعد.</p></div></section>
        <section class="panel"><h2>أحدث الحسابات</h2><div id="users"></div></section>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyB59fcv3POq5xS8zc52JYF97Eacw4mO7pA",
  authDomain:"petya-digital-product.firebaseapp.com",
  projectId:"petya-digital-product",
  storageBucket:"petya-digital-product.firebasestorage.app",
  messagingSenderId:"442610065781",
  appId:"1:442610065781:web:b203de716d66b1b822b33c",
  measurementId:"G-V4H5DVLTCT"
});
const auth=firebase.auth(), db=firebase.firestore();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={new:'جديد',pending:'قيد المعالجة',activated:'تم التفعيل',done:'مكتمل',completed:'مكتمل',received:'تم الاستلام',cancelled:'ملغي'};
let soundOn=true, unsubs=[], orders=[], logins=[];

// --- sound (beep, no file needed) ---
function beep(){ if(!soundOn) return; try{
  const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain();
  o.connect(g); g.connect(c.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6); o.start(); o.stop(c.currentTime+.6);
}catch(e){} }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),5000); }
function when(ts){ return ts&&ts.toDate? ts.toDate().toLocaleString('ar-DZ',{dateStyle:'short',timeStyle:'short'}):'...'; }
function isToday(ts){ if(!ts||!ts.toDate) return false; const d=ts.toDate(), n=new Date(); return d.toDateString()===n.toDateString(); }
function waLink(p){ let n=String(p||'').replace(/[^\d+]/g,''); if(n.startsWith('+')) n=n.slice(1); else if(n.startsWith('00')) n=n.slice(2); else if(n.startsWith('0')) n='213'+n.slice(1); return 'https://wa.me/'+n; }

// --- auth + admin check ---
$('gBtn').onclick=()=>{const gp=new firebase.auth.GoogleAuthProvider(); gp.setCustomParameters({prompt:'select_account'}); return auth.signInWithPopup(gp).catch(e=>{$('loginErr').textContent='تعذّر تسجيل الدخول: '+(e.code||'')})};
$('outBtn').onclick=()=>auth.signOut();
$('soundBtn').onclick=()=>{soundOn=!soundOn; $('soundBtn').textContent='🔔 الصوت: '+(soundOn?'مفعّل':'متوقف'); if(soundOn) beep();};

auth.onAuthStateChanged(async user=>{
  unsubs.forEach(u=>u()); unsubs=[];
  if(!user){ $('app').classList.add('hide'); $('login').classList.remove('hide'); return; }
  try{
    const a=await db.collection('admins').doc(user.uid).get();
    if(!a.exists) throw new Error('not-admin');
  }catch(e){
    $('loginErr').textContent='هذا الحساب ليس مشرفاً. (UID: '+user.uid+')';
    await auth.signOut(); $('loginErr').textContent='هذا الحساب ليس مشرفاً. (UID: '+user.uid+')'; return;
  }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  start();
});

function start(){
  // ORDERS (live)
  let first=true;
  unsubs.push(db.collection('orders').orderBy('createdAt','desc').limit(150).onSnapshot(snap=>{
    $('dot').classList.remove('off');
    if(!first) snap.docChanges().forEach(ch=>{
      if(ch.type==='added'){ const o=ch.doc.data(); beep(); toast('🛒 طلب جديد: '+(o.product||'')+' — '+(o.name||'')); }
      if(ch.type==='modified'&&ch.doc.data().customerReport==='not_received'){ beep(); toast('⚠️ بلاغ "لم أستلم" من '+(ch.doc.data().name||'')); }
    });
    orders=snap.docs.map(d=>({id:d.id,...d.data()})); renderOrders(first?null:snap.docChanges().filter(c=>c.type==='added').map(c=>c.doc.id)); first=false; stats();
  },e=>{ $('dot').classList.add('off'); $('orders').innerHTML='<p class="err">خطأ في تحميل الطلبات: '+esc(e.code)+' — تحقق من القواعد (Rules).</p>'; }));

  // USERS (new accounts, live)
  unsubs.push(db.collection('users').orderBy('createdAt','desc').limit(15).onSnapshot(snap=>{
    $('users').innerHTML=snap.docs.map(d=>{const u=d.data(); return `<div class="row"><div class="top"><b>${esc(u.username||'—')}</b><span class="meta">${when(u.createdAt)}</span></div><div class="meta"><span>${esc(u.phone||u.email||'')}</span></div></div>`;}).join('')||'<p class="empty">لا توجد حسابات.</p>';
  },e=>{ $('users').innerHTML='<p class="err">'+esc(e.code)+'</p>'; }));

  // LOGINS (live) — filled once the site logs sign-ins (phase 2)
  unsubs.push(db.collection('logins').orderBy('at','desc').limit(30).onSnapshot(snap=>{
    let f=snap.metadata.hasPendingWrites;
    logins=snap.docs.map(d=>d.data());
    $('logins').innerHTML=logins.map(l=>`<div class="row"><div class="top"><b>${esc(l.name||'—')}</b><span class="tag">${esc(l.method||'')}</span></div><div class="meta"><span>${esc(l.phone||l.email||'')}</span><span>${when(l.at)}</span></div></div>`).join('')||'<p class="empty">لا توجد بيانات بعد.</p>';
    stats();
  },e=>{ $('logins').innerHTML='<p class="empty">سجل الدخول غير مفعّل بعد.</p>'; }));
}

function renderOrders(freshIds){
  $('oCount').textContent=orders.length+' طلب';
  $('orders').innerHTML=orders.map(o=>{
    const st=o.status||'new', rep=o.customerReport==='not_received';
    const who=o.accountName||o.name||'—';
    return `<div class="row ${freshIds&&freshIds.includes(o.id)?'fresh':''}">
      <div class="top"><b>#${esc(o.id.slice(0,6).toUpperCase())} · ${esc(o.product||'')}${o.duration?' ('+esc(o.duration)+')':''}</b>
        <span><span class="tag ${esc(st)}">${esc(LABEL[st]||st)}</span>${rep?' <span class="tag report">لم يستلم</span>':''}</span></div>
      <div class="meta"><span>👤 ${esc(who)}</span><span>📞 ${esc(o.phone||'')}</span>${o.total?`<span>💰 ${esc(o.total)} DA</span>`:''}<span>🕒 ${when(o.createdAt)}</span></div>
      ${o.message?`<div class="meta">💬 ${esc(o.message)}</div>`:''}
      <div class="acts">
        <a href="${esc(waLink(o.phone))}" target="_blank" rel="noopener">واتساب</a>
        ${['pending','activated','done','cancelled'].filter(s=>s!==st).map(s=>`<button data-id="${esc(o.id)}" data-s="${s}">${LABEL[s]}</button>`).join('')}
      </div></div>`;
  }).join('')||'<p class="empty">لا توجد طلبات بعد.</p>';
}
$('orders').onclick=async e=>{
  const b=e.target.closest('button[data-s]'); if(!b) return;
  b.disabled=true;
  try{ await db.collection('orders').doc(b.dataset.id).update({status:b.dataset.s,statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()}); }
  catch(err){ alert('تعذّر تغيير الحالة: '+err.code); b.disabled=false; }
};

function stats(){
  const t=orders.filter(o=>isToday(o.createdAt));
  $('sNew').textContent=orders.filter(o=>(o.status||'new')==='new').length;
  $('sToday').textContent=t.length;
  $('sSales').textContent=t.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(parseInt(String(o.total).replace(/\D/g,''))||0),0).toLocaleString('ar-DZ');
  $('sRep').textContent=orders.filter(o=>o.customerReport==='not_received').length;
  $('sLog').textContent=logins.filter(l=>isToday(l.at)).length;
}
</script>
</body>
</html>
