<script>(function(){var t;try{t=localStorage.getItem('pt')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})()</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FB;--card:#fff;--card2:#F6F8FC;--text:#0F1B2D;--dim:#52627A;--faint:#8794A8;--line:#E3E9F2;--accent:#3B82F6;--shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px rgba(15,27,45,.06);color-scheme:light}
[data-theme=dark]{--bg:#0A1220;--card:#111E33;--card2:#0E1A2E;--text:#EAF2FF;--dim:#A9C0DE;--faint:#6F89AB;--line:#1E3050;--shadow:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",sans-serif;min-height:100vh;transition:background .25s,color .25s}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.i-sun{display:none}[data-theme=dark] .i-sun{display:inline}[data-theme=dark] .i-moon{display:none}
.stat i .ic{width:19px;height:19px;color:var(--c)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.chip .ic{width:1.2em;height:1.2em}
img.logo{display:block;object-fit:cover;background:none}
.hide{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#3B82F6,#6366f1);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;margin:0 auto 14px}
.btn{background:var(--accent);color:#fff;padding:13px 20px;border-radius:14px;font-weight:600;width:100%;margin-top:18px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.chip{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:500;transition:.15s;color:var(--dim)}
.chip:hover{border-color:var(--accent)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.brand .logo{width:38px;height:38px;font-size:18px;margin:0;border-radius:11px}
.pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#16a34a;background:rgba(34,197,94,.12);padding:5px 11px;border-radius:99px}
.pill.off{color:#dc2626;background:rgba(239,68,68,.12)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tools{display:flex;gap:8px;align-items:center}
main{padding:24px;max-width:1240px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.stat i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--c) 15%,transparent);margin-bottom:12px}
.stat span{color:var(--faint);font-size:13px}
.stat b{display:block;font-size:28px;margin-top:2px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;align-items:start}
@media(max-width:920px){.grid{grid-template-columns:1fr}header{padding:12px 14px}main{padding:14px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel h2 small{color:var(--faint);font-weight:500;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;outline:0}
.bar input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.chips .chip{padding:6px 12px;white-space:nowrap}
.chips .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.top b{font-size:14px}
.meta{color:var(--dim);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c,#3B82F6);background:color-mix(in srgb,var(--c,#3B82F6) 14%,transparent)}
.tag.pending{--c:#d97706}.tag.ok{--c:#16a34a}.tag.cancelled,.tag.report{--c:#dc2626}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.acts button{background:var(--card);border:1px solid var(--line);padding:6px 11px;border-radius:9px;font-size:12px;font-weight:500;transition:.15s}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts a{background:#25D366;color:#04210f;padding:6px 12px;border-radius:9px;font-size:12px;font-weight:700;text-decoration:none}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.person .meta{font-size:12px;gap:10px}
.person>div:last-child{flex:1;min-width:0}
.fresh{animation:f 3s ease-out}
@keyframes f{from{box-shadow:0 0 0 2px var(--accent)}to{box-shadow:0 0 0 2px transparent}}
.order{background:var(--card2);border:1px solid var(--line);border-inline-start:5px solid var(--c,#3B82F6);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.order.st-new{--c:#3B82F6}.order.st-pending{--c:#d97706}.order.st-ok{--c:#16a34a}.order.st-cancelled{--c:#dc2626}
.oh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pn{font-size:16px;font-weight:700}
.on{color:var(--faint);font-size:12px;margin-top:3px}
.pr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:700;font-size:18px;white-space:nowrap}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.fld small{display:block;color:var(--faint);font-size:11px;margin-bottom:2px}
.fld span{font-size:14px;font-weight:500;word-break:break-word}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--dim)}
.alert{background:rgba(220,38,38,.12);color:#dc2626;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.acts .go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.acts .go:hover{color:#fff;filter:brightness(1.1)}
.acts .no{color:#dc2626;border-color:color-mix(in srgb,#dc2626 40%,var(--line))}
.acts select{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px;font-family:inherit;color:inherit}
.acts a,.acts button{padding:8px 14px;font-size:13px}
.empty{color:var(--faint);font-size:14px;padding:8px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 22px;border-radius:14px;font-weight:600;z-index:9;box-shadow:0 12px 34px rgba(59,130,246,.4)}
.err{color:#dc2626;font-size:13px;margin-top:12px}
html{zoom:1.1}
body,.center{min-height:calc(100vh / 1.1)}
header{position:fixed;inset-block:0;inset-inline-start:0;width:248px;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:18px;padding:20px 16px;border-bottom:0;border-inline-end:1px solid var(--line);backdrop-filter:none;background:var(--card)}
.brand{flex-wrap:wrap}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{display:flex;align-items:center;gap:10px;background:none;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--dim);text-align:start;transition:.15s}
#nav button:hover{background:var(--card2)}
#nav button.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:600}
#nav em{margin-inline-start:auto;font-style:normal;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px}
.tools{margin-top:auto;flex-wrap:wrap}
main{margin:0;margin-inline-start:248px;max-width:none;padding:28px 32px}
.stat{transition:.2s}.stat:hover{transform:translateY(-2px)}
.stat b{font-variant-numeric:tabular-nums}
.bar select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-family:inherit;color:inherit}
#orders{display:flex;flex-direction:column;gap:12px}
.order{margin:0}
.sk{height:130px;border-radius:16px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
#app[data-v=orders] .sc,#app[data-v=people] .stats,#app[data-v=people] .mc{display:none}
#app[data-v=people] .sc{display:contents}
#app[data-v=people] .grid{grid-template-columns:1fr 1fr}
#app[data-v=orders] .grid{grid-template-columns:1fr}
@media(max-width:920px){
header{position:sticky;top:0;inset-block:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;border-inline-end:0;border-bottom:1px solid var(--line);z-index:5;gap:10px}
#nav{flex-direction:row;order:3;width:100%}#nav button{flex:1;justify-content:center}
.tools{margin-top:0;margin-inline-start:auto}
main{margin-inline-start:0;padding:14px}
#orders{grid-template-columns:1fr}
#app[data-v=people] .grid{grid-template-columns:1fr}}
</style>
</head>

<script>
const adminApp=firebase.initializeApp({
  apiKey:"AIzaSyB59fcv3POq5xS8zc52JYF97Eacw4mO7pA",
  authDomain:"petya-digital-product.firebaseapp.com",
  projectId:"petya-digital-product",
  storageBucket:"petya-digital-product.firebasestorage.app",
  messagingSenderId:"442610065781",
  appId:"1:442610065781:web:b203de716d66b1b822b33c",
  measurementId:"G-V4H5DVLTCT"
},'petya-admin');
const auth=adminApp.auth(), db=adminApp.firestore();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={new:'جديد',pending:'قيد المعالجة',activated:'تم التفعيل',done:'مكتمل',completed:'مكتمل',received:'تم الاستلام',cancelled:'ملغي'};
const OKS=['activated','done','completed','received'];
const FILTERS=[['all','الكل'],['new','جديد'],['pending','قيد المعالجة'],['activated','مفعّل'],['done','مكتمل'],['cancelled','ملغي'],['report','بلاغات']];
let soundOn=true, unsubs=[], orders=[], logins=[], filter='all', lastFresh=null;

function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('pt',t)}catch(e){}}
function beep(){ if(!soundOn) return; try{
  const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain();
  o.connect(g); g.connect(c.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6); o.start(); o.stop(c.currentTime+.6);
}catch(e){} }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),5000); }
function when(ts){ return ts&&ts.toDate? ts.toDate().toLocaleString('ar-DZ',{dateStyle:'short',timeStyle:'short'}):'...'; }
function isToday(ts){ return ts&&ts.toDate&&ts.toDate().toDateString()===new Date().toDateString(); }
function waLink(p){ let n=String(p||'').replace(/[^\d+]/g,''); if(n.startsWith('+')) n=n.slice(1); else if(n.startsWith('00')) n=n.slice(2); else if(n.startsWith('0')) n='213'+n.slice(1); return 'https://wa.me/'+n; }
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const ini=n=>esc(String(n||'?').trim().charAt(0).toUpperCase());
const cls=s=>OKS.includes(s)?'ok':s;

$('gBtn').onclick=()=>{const gp=new firebase.auth.GoogleAuthProvider(); gp.setCustomParameters({prompt:'select_account'}); return auth.signInWithPopup(gp).catch(e=>{$('loginErr').textContent='تعذّر تسجيل الدخول: '+(e.code||'')})};
$('outBtn').onclick=()=>auth.signOut();
$('soundBtn').onclick=()=>{soundOn=!soundOn; $('soundBtn').innerHTML=I(soundOn?'bell':'bell-off'); if(soundOn) beep();};
$('q').oninput=()=>renderOrders();
$('dr').onchange=()=>renderOrders();
$('nav').onclick=e=>{const b=e.target.closest('[data-v]'); if(!b) return; $('app').dataset.v=b.dataset.v; document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b)); window.scrollTo(0,0);};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('app').dataset.v='orders';$('q').focus();}});
$('csv').onclick=()=>{
  const h=['رقم','المنتج','المدة','السعر','الحالة','العميل','الهاتف','التاريخ'];
  const rows=curList.map(o=>[o.id.slice(0,6).toUpperCase(),o.product,o.duration,o.total,LABEL[o.status||'new']||o.status,o.name||o.accountName,o.phone,o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleString('en-GB'):'']);
  const csv='\ufeff'+[h,...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='petya-orders-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
};

$('chips').onclick=e=>{const b=e.target.closest('[data-f]'); if(!b) return; filter=b.dataset.f; renderOrders();};

auth.onAuthStateChanged(async user=>{
  unsubs.forEach(u=>u()); unsubs=[];
  if(!user){ $('app').classList.add('hide'); $('login').classList.remove('hide'); return; }
  try{
    const a=await db.collection('admins').doc(user.uid).get();
    if(!a.exists) throw new Error('not-admin');
  }catch(e){
    $('app').classList.add('hide'); $('login').classList.remove('hide');
    $('loginErr').textContent='هذا الحساب ليس مشرفاً. (UID: '+user.uid+') اضغط الدخول لاختيار حساب آخر.'; return;
  }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  start();
});

function start(){
  let first=true;
  unsubs.push(db.collection('orders').orderBy('createdAt','desc').limit(150).onSnapshot(snap=>{
    $('pill').classList.remove('off');
    if(!first) snap.docChanges().forEach(ch=>{
      if(ch.type==='added'){ const o=ch.doc.data(); beep(); toast('طلب جديد: '+(o.product||'')+' — '+(o.name||'')); }
      if(ch.type==='modified'&&ch.doc.data().customerReport==='not_received'){ beep(); toast('بلاغ "لم أستلم" من '+(ch.doc.data().name||'')); }
    });
    orders=snap.docs.map(d=>({id:d.id,...d.data()}));
    lastFresh=first?null:snap.docChanges().filter(c=>c.type==='added').map(c=>c.doc.id);
    first=false; renderOrders(); stats();
  },e=>{ $('pill').classList.add('off'); $('orders').innerHTML='<p class="err">خطأ في تحميل الطلبات: '+esc(e.code)+' — تحقق من القواعد (Rules).</p>'; }));

  unsubs.push(db.collection('users').orderBy('createdAt','desc').limit(50).onSnapshot(snap=>{
    $('users').innerHTML=snap.docs.map(d=>{const u=d.data(); return `<div class="person"><div class="av">${ini(u.username)}</div><div><div class="top"><b>${esc(u.username||'—')}</b><span class="meta">${when(u.createdAt)}</span></div><div class="meta"><span>${esc(u.phone||u.email||'')}</span></div></div></div>`;}).join('')||'<p class="empty">لا توجد حسابات.</p>';
  },e=>{ $('users').innerHTML='<p class="err">'+esc(e.code)+'</p>'; }));

  unsubs.push(db.collection('logins').orderBy('at','desc').limit(60).onSnapshot(snap=>{
    logins=snap.docs.map(d=>d.data());
    $('logins').innerHTML=logins.map(l=>`<div class="person"><div class="av">${ini(l.name)}</div><div><div class="top"><b>${esc(l.name||'—')}</b><span class="tag">${esc(l.method||'')}</span></div><div class="meta"><span>${esc(l.phone||l.email||'')}</span><span>${when(l.at)}</span></div></div></div>`).join('')||'<p class="empty">لا توجد بيانات بعد.</p>';
    stats();
  },e=>{ $('logins').innerHTML='<p class="empty">سجل الدخول غير مفعّل بعد.</p>'; }));
}

const NEXT={new:['pending','بدء المعالجة'],pending:['activated','تفعيل الطلب'],activated:['done','إكمال الطلب']};
function ago(ts){ if(!ts||!ts.toDate) return ''; const m=Math.floor((Date.now()-ts.toDate())/60000); if(m<1) return 'الآن'; if(m<60) return 'منذ '+m+' د'; const h=Math.floor(m/60); if(h<24) return 'منذ '+h+' س'; return 'منذ '+Math.floor(h/24)+' يوم'; }
const fld=(l,v)=>`<div class="fld"><small>${l}</small><span>${v}</span></div>`;
function match(o,k){ const st=o.status||'new'; if(k==='all') return true; if(k==='report') return o.customerReport==='not_received'; if(k==='done') return ['done','completed','received'].includes(st); return st===k; }
var curList=[];
function inRange(o){const v=$('dr').value; if(v==='all') return true; const d=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate():null; if(!d) return true; return v==='today'?d.toDateString()===new Date().toDateString():Date.now()-d<7*864e5;}
function renderOrders(){
  $('chips').innerHTML=FILTERS.map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${l} (${orders.filter(o=>match(o,k)).length})</button>`).join('');
  const q=$('q').value.trim().toLowerCase();
  const list=orders.filter(o=>match(o,filter)&&inRange(o)&&(!q||[o.name,o.accountName,o.phone,o.product,o.id].some(v=>String(v||'').toLowerCase().includes(q))));
  curList=list; $('oCount').textContent=list.length+' / '+orders.length;
  $('orders').innerHTML=list.map(o=>{
    const st=o.status||'new', rep=o.customerReport==='not_received', nx=NEXT[st];
    const nm=o.name||o.accountName||'—';
    return `<div class="order st-${esc(cls(st))} ${lastFresh&&lastFresh.includes(o.id)?'fresh':''}">
      <div class="oh">
        <div><div class="pn">${esc(o.product||'')}${o.duration?' · '+esc(o.duration):''}</div>
          <div class="on">#${esc(o.id.slice(0,6).toUpperCase())} · ${ago(o.createdAt)} · ${when(o.createdAt)}</div></div>
        <div class="pr">${o.total?esc(o.total)+' DA':''}<span class="tag ${esc(cls(st))}">${esc(LABEL[st]||st)}</span></div>
      </div>
      ${rep?`<div class="alert">${I('alert')} العميل أبلغ: لم أستلم المنتج</div>`:''}
      <div class="flds">
        ${fld('العميل',esc(nm))}
        ${fld('الهاتف','<bdi dir="ltr">'+esc(o.phone||'—')+'</bdi>')}
        ${o.accountName&&o.accountName!==nm?fld('اسم الحساب',esc(o.accountName)):''}
        ${o.accountEmail?fld('البريد','<bdi dir="ltr">'+esc(o.accountEmail)+'</bdi>'):''}
      </div>
      ${o.message?`<div class="note">${I('msg')} ${esc(o.message)}</div>`:''}
      <div class="acts">
        <a href="${esc(waLink(o.phone))}" target="_blank" rel="noopener">واتساب</a>
        ${nx?`<button class="go" data-id="${esc(o.id)}" data-s="${nx[0]}">${nx[1]}</button>`:''}
        ${st!=='cancelled'&&st!=='done'?`<button class="no" data-id="${esc(o.id)}" data-s="cancelled">إلغاء</button>`:''}
        <select data-id="${esc(o.id)}">${['new','pending','activated','done','cancelled'].map(k=>`<option value="${k}" ${(st===k||(k==='done'&&['completed','received'].includes(st)))?'selected':''}>${LABEL[k]}</option>`).join('')}</select>
        <button class="no" data-del="${esc(o.id)}" title="حذف نهائي">${I('trash')} حذف</button>
      </div></div>`;
  }).join('')||'<p class="empty">لا توجد طلبات مطابقة.</p>';
}
async function setStatus(id,st,el){
  if(st==='cancelled'&&!confirm('إلغاء هذا الطلب؟')){ renderOrders(); return; }
  el.disabled=true;
  try{ await db.collection('orders').doc(id).update({status:st,statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()}); }
  catch(err){ alert('تعذّر تغيير الحالة: '+err.code); el.disabled=false; renderOrders(); }
}
async function delOrder(id,el){
  if(!confirm('حذف هذا الطلب نهائياً؟\nلا يمكن التراجع عن هذه العملية.')) return;
  el.disabled=true;
  try{ await db.collection('orders').doc(id).delete(); toast('تم حذف الطلب'); }
  catch(err){ alert('تعذّر الحذف: '+err.code+'\nتأكد من تحديث قواعد Firestore (allow delete للمشرف).'); el.disabled=false; }
}
$('orders').onclick=e=>{
  const d=e.target.closest('button[data-del]'); if(d) return delOrder(d.dataset.del,d);
  const b=e.target.closest('button[data-s]'); if(b) setStatus(b.dataset.id,b.dataset.s,b);
};
$('orders').onchange=e=>{ const x=e.target.closest('select[data-id]'); if(x) setStatus(x.dataset.id,x.value,x); };

function stats(){
  const t=orders.filter(o=>isToday(o.createdAt));
  const nn=orders.filter(o=>(o.status||'new')==='new').length; $('sNew').textContent=nn; $('nBadge').textContent=nn; $('nBadge').classList.toggle('hide',!nn); document.title=(nn?'('+nn+') ':'')+'لوحة تحكم Petya';
  $('sToday').textContent=t.length;
  $('sSales').textContent=t.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(parseInt(String(o.total).replace(/\D/g,''))||0),0).toLocaleString('ar-DZ');
  $('sRep').textContent=orders.filter(o=>o.customerReport==='not_received').length;
  $('sLog').textContent=logins.filter(l=>isToday(l.at)).length;
}
</script>
</body>
</html>
